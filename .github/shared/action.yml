name: "Setup and install"
description: "Common setup steps for Actions"

outputs:
  cache-hit:
    description: "Whether pnpm store cache was hit"
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  store-path:
    description: "Path to pnpm store"
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Restore pnpm cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Verify latest Pi pins
      shell: bash
      run: |
        set -euo pipefail
        packages=(
          "@earendil-works/pi-agent-core"
          "@earendil-works/pi-ai"
          "@earendil-works/pi-coding-agent"
          "@earendil-works/pi-tui"
        )

        for package in "${packages[@]}"; do
          pinned="$(node -p "require('./package.json').devDependencies['$package']")"
          latest="$(pnpm view "$package" version)"
          test "$pinned" = "=$latest"
        done

        installed_pi_version="$(pnpm exec pi --version 2>&1 | tail -n 1)"
        latest_pi_version="$(pnpm view @earendil-works/pi-coding-agent version)"
        test "$installed_pi_version" = "$latest_pi_version"
